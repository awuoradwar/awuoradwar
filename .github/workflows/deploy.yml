name: Deploy to Firebase

# Runs "firebase deploy --only hosting,functions" automatically whenever
# the production branch changes, so it no longer has to be run by hand
# from a terminal after every push. Firestore rules deploys are
# deliberately left out -- they aren't covered by this session's test
# suite the way functions/hosting code is, so those stay a manual step.
#
# This workflow file must live at the repo root's .github/workflows --
# GitHub Actions ignores one nested inside panda-food-safety/. The app
# itself lives in that subfolder, so PROJECT_PATH points there.
on:
  push:
    branches:
      - claude/panda-express-safety-checklist-rjvmb7

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # firebase-tools statically loads the functions source locally (to
      # figure out what to deploy) before it ever reaches Cloud Build --
      # that step needs node_modules present in the checkout, which
      # git deliberately doesn't track.
      - name: Install functions dependencies
        working-directory: panda-food-safety/functions
        run: npm ci
      - uses: w9jds/firebase-action@v15.30.0
        with:
          args: deploy --only hosting,functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: food-safety-walkthrough
          PROJECT_PATH: panda-food-safety
